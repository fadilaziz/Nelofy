version: 3.8

services:

db:
  image: postgres:15-alpine
  container-name: postgres_db_nelofy
  restart: unless-stopped 
  env_file: 
  - .env
  ports:
  - "5432:5432"
  volumes:
  - postgres_data_nelofy:/var/lib/postgresql/data


api:
  build: .
  container-name: nelofy_api
  command: bun api/app.js
  ports: 
    - "4100:4100"
  restart: unless-stopped
  env_file: 
    - ./api/.env
  depends_on: 
    - db

public:
  build: .
  container-name: nelofy_public
  command: bun public/app.js
  ports: 
    - "3100:3100"
  restart: unless-stopped
  env_file: 
    - ./public/.env
  depends_on: 
    - db

admin:
  build: .
  container-name: nelofy_admin
  command: bun admin/app.js
  ports: 
    - "3200:3200"
  restart: unless-stopped
  env_file: 
    - ./admin/.env
  depends_on: 
    - db

volumes:
  postgres_data_nelofy:
  